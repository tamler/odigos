agent:
  name: "Bob"
  role: "systems_admin"
  description: "Test agent Bob for e2e card exchange testing"

server:
  host: "0.0.0.0"
  port: 8000
  ws_port: 8001

mesh:
  enabled: true

feed:
  enabled: true
  public: false
  max_entries: 200

database:
  path: "data/odigos.db"

providers:
  openrouter:
    base_url: "https://openrouter.ai/api/v1"
    api_key: "${OPENROUTER_API_KEY}"

models:
  deepseek-v3.2:
    provider: openrouter
    id: "deepseek/deepseek-v3.2"
    cost_in_per_mtok: 0.27
    cost_out_per_mtok: 1.10

llm:
  fast: deepseek-v3.2
  smart: deepseek-v3.2
  fallback: deepseek-v3.2

budget:
  daily_limit_usd: 1.00
  monthly_limit_usd: 5.00

heartbeat:
  interval_seconds: 30
  announce_interval_seconds: 60

approval:
  enabled: false
