[project]
name = "odigos"
version = "0.1.0"
description = "Self-hosted personal AI agent"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "httpx>=0.28.0",
    "aiosqlite>=0.20.0",
    "python-telegram-bot>=21.0",
    "pydantic-settings>=2.7.0",
    "pyyaml>=6.0",
    "sqlite-vec>=0.1.6",
    "sentence-transformers[onnx]>=3.0.0",
    "tiktoken>=0.7.0",
    "python-dateutil>=2.9.0",
    "feedparser>=6.0.0",
    "scrapling[fetchers]>=0.3.0",
    "mcp>=1.25.0",
    "chonkie[semantic]>=1.0.0",
    "markitdown[all]>=0.1.0",
    "einops>=0.8.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=4.0.0",
    "itsdangerous>=2.1.0",
    "python-docx>=1.0.0",
    "websockets>=12.0",
    "caldav>=3.0.0",
    "edge-tts>=6.0.0",
    "groq>=0.4.0",
    "webrtcvad-wheels>=2.0.14",
    "pywebpush>=2.3.0",
    "py-vapid>=1.9.4",
    "deep-translator>=1.11.4",
    "jsonschema>=4.0",
    "webauthn",
    "grokipedia-api>=0.3.0",
    "wikipedia>=1.4.0",
    "textblob>=0.19.0",
    "pytesseract>=0.3.10",
    "openpyxl>=3.1.0",
    "qrcode[pil]>=7.4",
    "icalendar>=7.0.0",
    "imap-tools>=1.10.0",
    "email-validator>=2.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.9.0",
]
stt = ["moonshine-voice>=0.0.52"]
tts = ["pocket-tts>=0.1.0", "scipy"]
audio = ["moonshine-voice>=0.0.52", "pocket-tts>=0.1.0", "scipy"]
notebooklm = ["notebooklm-py>=0.1.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
odigos = "odigos.main:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.uv]
# Force CPU-only PyTorch — no GPU servers, no CUDA needed
extra-index-url = ["https://download.pytorch.org/whl/cpu"]
override-dependencies = ["torch>=2.0,<3"]
index-strategy = "unsafe-best-match"

[tool.ruff]
target-version = "py312"
line-length = 100
